<g style="animation:k9 14.80s linear infinite"><text class="cap" x="20.0" y="474.0">Check 1, SUPPORT: at least 70 % of the base must rest at the landing</text><text class="cap" x="20.0" y="498.0">height.</text></g><g style="animation:k10 14.80s linear infinite"><text class="cap" x="20.0" y="474.0">Only the half over D touches at 220: 50 % held.</text></g><g style="animation:k11 14.80s linear infinite"><text class="cap" x="20.0" y="474.0">50 % &lt; 70 %: the box would rock like a see-saw. Rejected.</text></g><g style="animation:k12 14.80s linear infinite"><text class="cap" x="20.0" y="474.0">The same box fully on D: 100 % ≥ 70 %. Accepted ✓</text></g></g></svg>