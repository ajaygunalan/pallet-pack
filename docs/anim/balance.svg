<g class="k10" style="transform-box:view-box;transform-origin:235px 375px"><g class="k2"><rect x="168.5" y="280" width="95" height="95" rx="2" fill="#ffffff" stroke-width="1.6" class="k1"/><text x="176.5" y="298" font-size="12" text-anchor="start" >box 2</text></g><g class="k4"><rect x="197" y="185" width="95" height="95" rx="2" fill="#ffffff" stroke-width="1.6" class="k3"/><text x="205" y="203" font-size="12" text-anchor="start" >box 3</text></g><g class="k6"><rect x="225.5" y="90" width="95" height="95" rx="2" fill="#ffffff" stroke-width="1.6" class="k5"/><text x="233.5" y="108" font-size="12" text-anchor="start" >box 4</text></g><g class="k7"><text x="271.5" y="379" font-size="11" text-anchor="start" class="g" >70 % contact ✓</text></g><g class="k8"><text x="300" y="284" font-size="11" text-anchor="start" class="g" >70 % contact ✓</text></g><g class="k9"><text x="328.5" y="189" font-size="11" text-anchor="start" class="g" >70 % contact ✓</text></g><g class="k14"><circle cx="230.25" cy="280" r="11" fill="#e8552b" opacity="0.18"/><text x="230.25" y="287" font-size="20" text-anchor="middle" fill="#e8552b" font-weight="700">✱</text></g></g>
<g ><text x="420" y="44" font-size="13" text-anchor="start" >For every box: the combined centre of</text><text x="420" y="63" font-size="13" text-anchor="start" >mass of it + everything above must</text><text x="420" y="82" font-size="13" text-anchor="start" >fall inside the support it gets below.</text></g>
<g class="k15"><text x="420" y="120" font-size="13" text-anchor="start" class="g" >Three stairs, 30 mm shift each:</text><text x="420" y="139" font-size="13" text-anchor="start" class="g" >every joint passes SUPPORT.</text></g>
<g class="k16"><text x="420" y="180" font-size="13" text-anchor="start" font-weight="600" >✱ = centre of mass of boxes 2 + 3</text><text x="420" y="200" font-size="13" text-anchor="start" font-weight="600" >x = 95 mm, inside 30 – 100 mm</text><text x="420" y="220" font-size="13" text-anchor="start" font-weight="600" >→ box 2 stands ✓</text></g>
<g class="k17"><text x="420" y="120" font-size="13" text-anchor="start" class="g" >A fourth stair: its own joint</text><text x="420" y="139" font-size="13" text-anchor="start" class="g" >still passes SUPPORT (70 %).</text></g>
<g class="k18"><text x="420" y="180" font-size="13" text-anchor="start" fill="#e8552b" font-weight="600" >✱ = centre of mass of boxes 2 + 3 + 4</text><text x="420" y="200" font-size="13" text-anchor="start" fill="#e8552b" font-weight="600" >x = 110 mm, past box 1's edge (100)</text><text x="420" y="220" font-size="13" text-anchor="start" fill="#e8552b" font-weight="600" >nothing underneath → 2, 3, 4 tip</text></g>
<g class="k19"><text x="420" y="260" font-size="14" text-anchor="start" font-weight="600" >→ the 4th box is rejected;</text><text x="420" y="280" font-size="14" text-anchor="start" font-weight="600" >the three stairs stand</text></g>
<g ><text x="420" y="330" font-size="12" text-anchor="start" class="g" >Each joint looks fine alone; the</text><text x="420" y="347" font-size="12" text-anchor="start" class="g" >failure appears only when the loads</text><text x="420" y="364" font-size="12" text-anchor="start" class="g" >combine. (Equal masses; test fixture</text><text x="420" y="381" font-size="12" text-anchor="start" class="g" >test_jenga_staircase_rejected.)</text></g>
</g>
