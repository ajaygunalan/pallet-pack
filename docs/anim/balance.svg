<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d">
<title id="t">Check 2 BALANCE</title>
<desc id="d">Four identical 100 mm boxes stacked as stairs, each shifted 30 mm: every joint has 70 % contact. With three boxes the combined centre of mass of boxes 2 and 3 (x = 95 mm) stays over box 1 (30 to 100 mm). The fourth box moves the combined centre of boxes 2, 3 and 4 to x = 110 mm, past box 1's edge: rejected.</desc>
