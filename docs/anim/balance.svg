<g class="k11"><rect x="168.5" y="372" width="66.5" height="6" fill="#1d1d1f"/><text x="130" y="361" font-size="11" text-anchor="end" class="g" >box 2 rests</text><text x="130" y="375" font-size="11" text-anchor="end" class="g" >on 30 – 100 mm</text><line x1="134" y1="371" x2="166.5" y2="374" stroke="#6b6b6b" stroke-width="0.8" /></g>
