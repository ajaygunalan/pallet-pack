rames k21{0.000%{opacity:1}15.877%{opacity:1}18.106%{opacity:0}100.000%{opacity:0}}@keyframes k22{0.000%{opacity:0}16.992%{opacity:0}19.499%{opacity:1}36.769%{opacity:1}38.997%{opacity:0}100.000%{opacity:0}}@keyframes k23{0.000%{opacity:0}37.883%{opacity:0}40.390%{opacity:1}57.660%{opacity:1}59.889%{opacity:0}100.000%{opacity:0}}@keyframes k24{0.000%{opacity:0}58.774%{opacity:0}61.281%{opacity:1}77.437%{opacity:1}79.666%{opacity:0}100.000%{opacity:0}}@keyframes k25{0.000%{opacity:0}78.552%{opacity:0}81.058%{opacity:1}100.000%{opacity:1}}@keyframes k26{0.000%{opacity:1}100.000%{opacity:1}}@keyframes k27{0.000%{opacity:0}2.228%{opacity:1}95.543%{opacity:1}98.886%{opacity:0}100.000%{opacity:0}}</style><rect x="-1" y="-51" width="642" height="602" fill="#FFFFFF"/><g style="animation:k27 17.95s linear infinite"><text class="ttl" x="20.0" y="-22.0" style="animation:k26 17.95s linear infinite">How do we model the pallet?</text>
<defs><pattern id="pph4" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-width="1.2"/></pattern></defs>
<line class="fl" x1="30" y1="320" x2="560" y2="320"/><text x="566" y="325">deck</text>
<g class="cm pp4d" style="animation:k1 17.95s linear infinite,k2 17.95s linear infinite"><rect class="bx" x="60" y="195.1" width="210" height="124.9"/><text class="bl" x="165" y="253.1" text-anchor="middle">D</text><text x="165" y="275.1" text-anchor="middle">220 mm</text></g>
<g class="cm pp4c" style="animation:k3 17.95s linear infinite,k4 17.95s linear infinite"><rect class="bx2" x="270" y="211" width="220.2" height="109"/><text class="bl" x="380.1" y="261" text-anchor="middle">C</text><text x="380.1" y="283" text-anchor="middle">192 mm</text></g>
<rect class="cell" x="62" y="345" width="66" height="36" rx="4"/>
<text x="95" y="369" text-anchor="middle" style="animation:k5 17.95s linear infinite">0</text>
<text class="bl" x="95" y="369" text-anchor="middle" style="animation:k6 17.95s linear infinite">220</text>
<rect class="cell" x="132" y="345" width="66" height="36" rx="4"/>
<text x="165" y="369" text-anchor="middle" style="animation:k7 17.95s linear infinite">0</text>
<text class="bl" x="165" y="369" text-anchor="middle" style="animation:k8 17.95s linear infinite">220</text>
<rect class="cell" x="202" y="345" width="66" height="36" rx="4"/>
<text x="235" y="369" text-anchor="middle" style="animation:k9 17.95s linear infinite">0</text>
<text class="bl" x="235" y="369" text-anchor="middle" style="animation:k10 17.95s linear infinite">220</text>
<rect class="cell" x="272" y="345" width="106" height="36" rx="4"/>
<text x="325" y="369" text-anchor="middle" style="animation:k11 17.95s linear infinite">0</text>
<text class="bl" x="325" y="369" text-anchor="middle" style="animation:k12 17.95s linear infinite">192</text>
<rect class="cell" x="382" y="345" width="106" height="36" rx="4"/>
<text x="435" y="369" text-anchor="middle" style="animation:k13 17.95s linear infinite">0</text>
<text class="bl" x="435" y="369" text-anchor="middle" style="animation:k14 17.95s linear infinite">192</text>
<rect class="cell" x="492.2" y="345" width="66" height="36" rx="4"/>
<text x="525.2" y="369" text-anchor="middle">0</text>
<text x="165" y="402" text-anchor="middle" style="animation:k15 17.95s linear infinite">under D</text>
<text x="380.1" y="402" text-anchor="middle" style="animation:k16 17.95s linear infinite">under C</text>
<text x="525.2" y="402" text-anchor="middle">empty</text>
<text x="60" y="428">the grid of stack heights (1 mm cells, drawn coarse)</text>
<rect class="fp" x="211.5" y="345" width="116.9" height="36" rx="4" style="animation:k17 17.95s linear infinite"/>
<g class="cm pp4n" style="animation:k18 17.95s linear infinite,k19 17.95s linear infinite"><rect class="nb" x="211.5" y="37.4" width="116.9" height="157.8"/><text class="bl" x="270" y="122.2" text-anchor="middle">new box</text></g>
<g style="animation:k20 17.95s linear infinite"><rect x="270" y="195.1" width="58.5" height="15.9" fill="url(#pph4)"/><text class="a" x="336.5" y="189.1">28 mm of air</text></g>
<g style="animation:k21 17.95s linear infinite"><text class="cap" x="20.0" y="474.0">The solver keeps the pallet top as a grid of stack heights. At the</text><text class="cap" x="20.0" y="498.0">start every cell reads 0.</text></g><g style="animation:k22 17.95s linear infinite"><text class="cap" x="20.0" y="474.0">D lands: its cells read 220.</text></g><g style="animation:k23 17.95s linear infinite"><text class="cap" x="20.0" y="474.0">C lands: its cells read 192.</text></g><g style="animation:k24 17.95s linear infinite"><text class="cap" x="20.0" y="474.0">A new box never chooses its height. It lands on the tallest cell</text><text class="cap" x="20.0" y="498.0">under its base: max(220, 192) = 220</text></g><g style="animation:k25 17.95s linear infinite"><text class="cap" x="20.0" y="474.0">Under the half over C: 28 mm of air. Nothing floats, nothing</text><text class="cap" x="20.0" y="498.0">overlaps, by construction. May it stay there?</text></g></g></svg>