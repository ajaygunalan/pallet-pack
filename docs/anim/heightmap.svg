<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 640 600" width="640" height="600" role="img" aria-label="How do we model the pallet?"><style>:root{--paper:#FFFFFF;--ink:#121417;--graphite:#5F646B;--line:#E4E6E9;--accent:#F04E23;--wash:#F5F5F3;}
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#5F646B}
text.bl{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;fill:#121417}
text.wl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;fill:#FFFFFF}
text.a{fill:#F04E23} text.x{font-family:ui-sans-serif,system-ui,sans-serif;font-size:34px;fill:#F04E23;font-weight:600}
.bx{fill:#F5F5F3;stroke:#121417;stroke-width:1.5;stroke-linejoin:round}
.bx2{fill:#FFFFFF;stroke:#121417;stroke-width:1.5;stroke-linejoin:round}
.hv{fill:#121417;stroke:#121417;stroke-width:1.5}
.nb{fill:#FFFFFF;stroke:#F04E23;stroke-width:2}
.nw{fill:#F04E23;stroke:#121417;stroke-width:1.2}
.dk{fill:#E4E6E9;stroke:#121417;stroke-width:1.5}
.fl{stroke:#5F646B;stroke-width:1}
.acc{stroke:#F04E23;stroke-width:4;stroke-linecap:round}
.ring{fill:none;stroke:#F04E23;stroke-width:2}
.dash{fill:none;stroke:#F04E23;stroke-width:1.6;stroke-dasharray:6 5}
.edge{stroke:#5F646B;stroke-width:1.2}
.roll{stroke:#5F646B;stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round}
.cell{fill:#FFFFFF;stroke:#5F646B;stroke-width:1}
.fp{fill:none;stroke:#F04E23;stroke-width:2.5}
.idk{fill:#E4E6E9;stroke:#5F646B;stroke-width:.8} .idk2{fill:color-mix(in srgb,#E4E6E9 80%,#000);stroke:#5F646B;stroke-width:.8} .idk3{fill:color-mix(in srgb,#E4E6E9 88%,#000);stroke:#5F646B;stroke-width:.8}
.ia,.ib,.ic,.id{stroke:#121417;stroke-width:.9;stroke-linejoin:round}
.ia{stroke:#F04E23;stroke-width:1.2} .ia.t{fill:#FFFFFF} .ia.r{fill:color-mix(in srgb,#FFFFFF 88%,#000)} .ia.fr{fill:color-mix(in srgb,#FFFFFF 80%,#000)}
.id.t{fill:#F5F5F3} .id.r{fill:color-mix(in srgb,#F5F5F3 88%,#000)} .id.fr{fill:color-mix(in srgb,#F5F5F3 80%,#000)}
.ic.t{fill:#FFFFFF} .ic.r{fill:color-mix(in srgb,#FFFFFF 88%,#000)} .ic.fr{fill:color-mix(in srgb,#FFFFFF 80%,#000)}
.ib.t{fill:#E4E6E9} .ib.r{fill:color-mix(in srgb,#E4E6E9 88%,#000)} .ib.fr{fill:color-mix(in srgb,#E4E6E9 80%,#000)}
text.il{font-size:13px;fill:#121417}
.ihull{fill:#F04E23;fill-opacity:.16;stroke:#F04E23;stroke-width:1.6;stroke-dasharray:6 4}
.isl{fill:#FFFFFF;fill-opacity:.55;stroke:#5F646B;stroke-width:1.1;stroke-dasharray:5 4}
.img polygon{fill:#FFFFFF;fill-opacity:.35;stroke:#5F646B;stroke-width:.8;stroke-dasharray:3 2}
.dg{fill:#E4E6E9} .dok{fill:#121417} .dno{fill:none;stroke:#F04E23;stroke-width:1.2} .dring{fill:none;stroke:#F04E23;stroke-width:2}
.cap{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;fill:#121417}
.ttl{font-family:Georgia,"Times New Roman",serif;font-size:26px;fill:#121417}
