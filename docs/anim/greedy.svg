<g style="animation:k16 14.10s linear infinite"><text class="cap" x="20.0" y="474.0">Every placement must pass the checks. Which legal move should we</text><text class="cap" x="20.0" y="498.0">take?</text></g><g style="animation:k17 14.10s linear infinite"><text class="cap" x="20.0" y="474.0">Greedy chooses the best placement now. Every box passes the checks.</text></g><g style="animation:k18 14.10s linear infinite"><text class="cap" x="20.0" y="474.0">All the boxes fit, but their top contact is bunched at one end. The</text><text class="cap" x="20.0" y="498.0">finished pallet is not stackable.</text></g></g></svg>