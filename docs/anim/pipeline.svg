.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.g{fill:#6b6b6b}
.acc{fill:#e8552b}
@keyframes k0{0.000%{opacity:0;transform:translate(75px,64px)}4.444%{opacity:0;transform:translate(75px,64px)}6.667%{opacity:1;transform:translate(75px,64px)}15.556%{opacity:1;transform:translate(225px,64px)}32.222%{opacity:1;transform:translate(225px,64px)}33.333%{opacity:1;transform:translate(385px,64px)}44.444%{opacity:1;transform:translate(545px,64px)}54.444%{opacity:1;transform:translate(545px,64px)}55.556%{opacity:1;transform:translate(710px,64px)}57.778%{opacity:1;transform:translate(710px,64px)}61.111%{opacity:0;transform:translate(710px,64px)}100.000%{opacity:0;transform:translate(710px,64px)}}
.k0{animation:k0 9s infinite both}
