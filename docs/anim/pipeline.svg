.k1{animation:k1 9s infinite both}
@keyframes k2{0.000%{opacity:0}5.556%{opacity:0}7.778%{opacity:1}13.333%{opacity:1}17.778%{opacity:0}100.000%{opacity:0}}
.k2{animation:k2 9s infinite both}
@keyframes k3{0.000%{opacity:0}15.556%{opacity:0}17.778%{opacity:1}32.222%{opacity:1}36.667%{opacity:0}100.000%{opacity:0}}
.k3{animation:k3 9s infinite both}
@keyframes k4{0.000%{opacity:0}33.333%{opacity:0}35.556%{opacity:1}41.111%{opacity:1}45.556%{opacity:0}100.000%{opacity:0}}
.k4{animation:k4 9s infinite both}
@keyframes k5{0.000%{opacity:0}44.444%{opacity:0}46.667%{opacity:1}52.222%{opacity:1}56.667%{opacity:0}100.000%{opacity:0}}
.k5{animation:k5 9s infinite both}
@keyframes k6{0.000%{opacity:0}55.556%{opacity:0}57.778%{opacity:1}63.333%{opacity:1}67.778%{opacity:0}100.000%{opacity:0}}
.k6{animation:k6 9s infinite both}
@keyframes k7{0.000%{opacity:0}55.556%{opacity:0}59.444%{opacity:1}100.000%{opacity:1}}
.k7{animation:k7 9s infinite both}
@keyframes k8{0.000%{opacity:0}66.667%{opacity:0}68.889%{opacity:1}74.444%{opacity:1}78.889%{opacity:0}100.000%{opacity:0}}
.k8{animation:k8 9s infinite both}
@keyframes k9{0.000%{opacity:0}76.667%{opacity:0}78.889%{opacity:1}84.444%{opacity:1}88.889%{opacity:0}100.000%{opacity:0}}
.k9{animation:k9 9s infinite both}
@keyframes k10{0.000%{opacity:0}16.667%{opacity:0}20.556%{opacity:1}31.111%{opacity:1}35.000%{opacity:0}100.000%{opacity:0}}
.k10{animation:k10 9s infinite both}
@keyframes k11{0.000%{opacity:0}45.556%{opacity:0}49.444%{opacity:1}54.444%{opacity:1}58.333%{opacity:0}100.000%{opacity:0}}
.k11{animation:k11 9s infinite both}
@keyframes k12{0.000%{opacity:0}3.889%{opacity:1}93.889%{opacity:1}98.889%{opacity:0}100.000%{opacity:0}}
.k12{animation:k12 9s infinite both}
