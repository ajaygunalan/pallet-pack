<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="t d">
<title id="t">Architecture pipeline</title>
<desc id="d">case.json goes into solver.py, which writes plan_auto.json; verify.py judges the plan as a separate process (PASS or FAIL) and viewer.py renders plan_auto.html. main.py runs all three.</desc>
<style>
