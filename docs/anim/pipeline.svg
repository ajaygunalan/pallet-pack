<rect x="1" y="1" width="798" height="218" rx="14" fill="#fbfaf7" stroke="#e2ddd3"/>
<g fill="#1d1d1f" class="k12">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8552b"/></marker>
</defs>
<circle cx="0" cy="0" r="7" fill="#e8552b" class="k0" style="animation-timing-function:linear"/>
<circle cx="0" cy="0" r="7" fill="#e8552b" class="k1" style="animation-timing-function:linear"/>
<rect x="20" y="44" width="110" height="40" rx="7" fill="#fbfaf7" stroke="#1d1d1f" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="20" y="44" width="110" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k2"/>
<text x="75" y="69" font-size="13" text-anchor="middle" class="m" >case.json</text>
<rect x="170" y="44" width="110" height="40" rx="7" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4" />
<rect x="170" y="44" width="110" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k3"/>
<text x="225" y="69" font-size="13" text-anchor="middle" class="m" >solver.py</text>
<rect x="320" y="44" width="130" height="40" rx="7" fill="#fbfaf7" stroke="#1d1d1f" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="320" y="44" width="130" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k4"/>
<text x="385" y="69" font-size="13" text-anchor="middle" class="m" >plan_auto.json</text>
<rect x="490" y="44" width="110" height="40" rx="7" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4" />
<rect x="490" y="44" width="110" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k5"/>
