<rect x="640" y="44" width="140" height="40" rx="7" fill="#fbfaf7" stroke="#1d1d1f" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="640" y="44" width="140" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k6"/>
<text x="710" y="69" font-size="13" text-anchor="middle" class="m" >PASS / FAIL</text>
<g class="k7"><rect x="643" y="47" width="134" height="34" rx="6" fill="#fbfaf7"/><text x="710" y="69" font-size="14" text-anchor="middle" class="m" font-weight="700" >PASS</text></g>
<rect x="490" y="124" width="110" height="40" rx="7" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4" />
<rect x="490" y="124" width="110" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k8"/>
<text x="545" y="149" font-size="13" text-anchor="middle" class="m" >viewer.py</text>
<rect x="640" y="124" width="140" height="40" rx="7" fill="#fbfaf7" stroke="#1d1d1f" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="640" y="124" width="140" height="40" rx="7" fill="none" stroke="#e8552b" stroke-width="3" class="k9"/>
<text x="710" y="149" font-size="13" text-anchor="middle" class="m" >plan_auto.html</text>
<line x1="130" y1="64" x2="168" y2="64" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="280" y1="64" x2="318" y2="64" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="450" y1="64" x2="488" y2="64" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="600" y1="64" x2="638" y2="64" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M385,84 V144 H488" fill="none" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="600" y1="144" x2="638" y2="144" stroke="#1d1d1f" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="k10"><text x="225" y="34" font-size="11" text-anchor="middle" class="acc" >searching…</text></g>
<g class="k11"><text x="545" y="34" font-size="11" text-anchor="middle" class="acc" >checks 5 rules</text></g>
<text x="400" y="196" font-size="12" text-anchor="middle" class="g" >main.py runs all three in one command; verify.py runs as a separate process and never imports solver.py</text>
</g>
