<text x="10" y="300" style="animation:k15 13.60s linear infinite">Both completion patterns</text><text x="10" y="318" style="animation:k16 13.60s linear infinite">are used during search.</text>
<g style="animation:k17 13.60s linear infinite"><text class="cap" x="20.0" y="474.0">The score also depends on the completion strategy.</text></g><g style="animation:k18 13.60s linear infinite"><text class="cap" x="20.0" y="474.0">Platform spreads the tallest boxes around the edges.</text></g><g style="animation:k19 13.60s linear infinite"><text class="cap" x="20.0" y="474.0">Then the shorter boxes fill the space below that level.</text></g><g style="animation:k20 13.60s linear infinite"><text class="cap" x="20.0" y="474.0">Automatic mode tries both tiled and platform completions while</text><text class="cap" x="20.0" y="498.0">searching, and saves the best plan it sees: the acceptance_1 pallet</text><text class="cap" x="20.0" y="522.0">from the first slide.</text></g></g></svg>